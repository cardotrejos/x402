name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - elixir: "1.19"
            otp: "27"
          - elixir: "1.20"
            otp: "29"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - name: Cache deps
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-v3-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-v3-${{ matrix.elixir }}-${{ matrix.otp }}-
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix credo --strict
      - name: Run tests with coverage
        run: mix coveralls
        env:
          MIX_ENV: test
      - run: mix compile --no-optional-deps --warnings-as-errors
        name: Compile without optional deps
      - name: Compile as a downstream consumer
        working-directory: integration/consumer
        run: |
          mix deps.get
          mix compile --warnings-as-errors
          mix run smoke.exs

  # Advisory only. mix_audit reads a local clone of the advisory database and
  # can miss current advisories, and `mix hex.audit` flags locked packages
  # that are awaiting an owner decision (bump or ignore). Neither result gates
  # PRs or Hex publish, so this job is non-blocking until that is resolved.
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.20"
          otp-version: "29"
      - run: mix deps.get
      - run: mix hex.audit
      - run: mix deps.audit

  dialyzer:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - elixir: "1.19"
            otp: "27"
          - elixir: "1.20"
            otp: "29"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - name: Cache deps
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-v2-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-v2-${{ matrix.elixir }}-${{ matrix.otp }}-
      - name: Cache PLTs
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-v3-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          # No version-less fallback: restoring another toolchain's PLT
          # forces a slow cross-OTP in-place update on every run.
          restore-keys: |
            ${{ runner.os }}-plt-v3-${{ matrix.elixir }}-${{ matrix.otp }}-
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix dialyzer --format github

  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        elixir: ["1.20"]
        otp: ["29"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - name: Cache deps
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-v3-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-v3-${{ matrix.elixir }}-${{ matrix.otp }}-
      - run: mix deps.get
      - run: mix docs --warnings-as-errors
      - run: mix hex.build
