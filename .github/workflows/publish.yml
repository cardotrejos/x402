name: Publish to Hex.pm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Read from main, not the tagged commit, so a tag cannot weaken its own gate.
  # The tagged commit is still the one tested: reusable workflows check out github.sha.
  ci:
    uses: cardotrejos/x402/.github/workflows/ci.yml@main

  publish:
    needs: [ci]
    runs-on: ubuntu-latest
    environment: hex
    env:
      ELIXIR_VERSION: "1.20"
      OTP_VERSION: "29"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Verify tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-v3-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-v3-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - run: mix deps.get
      - run: mix compile --warnings-as-errors

      - name: Verify tag matches package version
        run: |
          package_version="$(mix run --no-start -e 'IO.write(Mix.Project.config()[:version])')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$tag_version" != "$package_version" ]; then
            echo "Tag version $tag_version does not match package version $package_version"
            exit 1
          fi

      - name: Publish to Hex.pm
        run: mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
